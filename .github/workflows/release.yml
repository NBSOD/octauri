name: build

on:
  push:
    tags:
      - "v*"
    # 每次 push 到 main 也构建一次，但只构建、不发布。
    # 目的：GitHub Actions 的缓存按 ref 隔离，tag 之间互相看不到对方的缓存，
    # 所以「只在 tag 上构建」等于每次发版都冷编译（实测 Windows 5m26s 里 5m04s
    # 全是 cargo 编译）。默认分支（main）的缓存对所有 tag 可见，因此先在 main
    # 上把缓存喂热，tag 运行时就能走增量编译。
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# 同一 ref 的重复运行只保留最新一次；tag 运行永不取消（避免打断发布）。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS-arm64-dmg
            args: "--target aarch64-apple-darwin --bundles dmg"
            targets: "aarch64-apple-darwin"
          - platform: windows-latest
            label: Windows-nsis
            args: "--bundles nsis"
            targets: ""

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装前端依赖
        run: npm ci

      - name: 检查 Windows 捆绑的运行时
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          # wintun 随仓库分发，缺失属于致命错误
          test -f src-tauri/resources/openconnect/wintun.dll \
            || { echo "::error::缺少 wintun.dll"; exit 1; }
          test -f src-tauri/resources/openconnect/wintun-license.txt \
            || { echo "::error::缺少 wintun-license.txt（分发义务要求保留）"; exit 1; }
          echo "✅ wintun.dll $(stat -c%s src-tauri/resources/openconnect/wintun.dll) bytes"

          # openconnect.exe 需用户自备，缺失仅警告
          if [ -f "src-tauri/resources/openconnect/openconnect.exe" ]; then
            echo "✅ 已找到内置 openconnect.exe"
            ls -la src-tauri/resources/openconnect/
            # 兼容模式要给 openconnect 传 --allow-insecure-crypto，而该开关
            # 要求 3DES/RC4 可用；OpenSSL 3 只在 legacy provider 里提供它们。
            test -f src-tauri/resources/openconnect/ossl-modules/legacy.dll \
              || { echo "::error::缺少 ossl-modules/legacy.dll，兼容模式将报 Cannot enable insecure 3DES or RC4 ciphers"; exit 1; }
            echo "✅ legacy provider $(stat -c%s src-tauri/resources/openconnect/ossl-modules/legacy.dll) bytes"
          else
            echo "::warning::src-tauri/resources/openconnect/openconnect.exe 不存在，本次产物将不含内置 openconnect，用户需自行指定路径。"
          fi

      - name: 校验 macOS 内置运行时
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          OC=src-tauri/resources/openconnect/macos-arm64/openconnect
          if [ ! -x "$OC" ]; then
            echo "::error::缺少内置 openconnect，请在本机执行 scripts/bundle-openconnect-macos.sh 后提交 macos-arm64/ 目录"
            exit 1
          fi
          "$OC" --version

      # 只有确实配置了证书时才注入签名变量。
      # 注意：不能把空的 APPLE_CERTIFICATE 作为环境变量传给 tauri ——
      # 变量存在但为空时 Tauri 仍会尝试导入 p12，报
      # "SecKeychainItemImport: Unable to decode the provided data"。
      - name: 配置 macOS 签名（可选）
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ACCOUNT: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASS: ${{ secrets.APPLE_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$HAS_APPLE_CERT" != "true" ]; then
            echo "未配置 APPLE_CERTIFICATE，跳过签名（产物为未签名 dmg）"
            exit 0
          fi
          printf 'APPLE_CERTIFICATE=%s\n' "$CERT" >> "$GITHUB_ENV"
          printf 'APPLE_CERTIFICATE_PASSWORD=%s\n' "$CERT_PASS" >> "$GITHUB_ENV"
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$SIGN_IDENTITY" >> "$GITHUB_ENV"
          printf 'APPLE_ID=%s\n' "$APPLE_ACCOUNT" >> "$GITHUB_ENV"
          printf 'APPLE_PASSWORD=%s\n' "$APPLE_APP_PASS" >> "$GITHUB_ENV"
          printf 'APPLE_TEAM_ID=%s\n' "$TEAM" >> "$GITHUB_ENV"

      # 有 tag 时创建并【直接发布】release（不再留草稿等待手动 publish）；push 到 main / 手动触发时只构建并上传 artifact
      - name: 构建并打包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Octauri {0}', github.ref_name) || '' }}
          releaseBody: >-
            macOS 产物为 .dmg（未签名，首次打开需右键 →「打开」，或执行
            xattr -dr com.apple.quarantine /Applications/Octauri.app）；
            Windows 产物为 NSIS 安装包 .exe（未签名，SmartScreen 会提示）。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # 把 exe / dmg 收拢到同一层目录，避免下载 Artifact 后出现
      # Windows-nsis/release/bundle/nsis/... 这种很长的相对路径。
      - name: 整理产物（扁平化）
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          find src-tauri/target -path '*/release/bundle/nsis/*.exe' -exec cp -v {} artifacts/ \;
          find src-tauri/target -path '*/release/bundle/dmg/*.dmg' -exec cp -v {} artifacts/ \;
          ls -la artifacts

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          if-no-files-found: warn
          path: artifacts/*