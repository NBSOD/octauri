name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS-arm64-dmg
            args: "--target aarch64-apple-darwin --bundles dmg"
            targets: "aarch64-apple-darwin"
          - platform: windows-latest
            label: Windows-nsis
            args: "--bundles nsis"
            targets: ""

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装前端依赖
        run: npm ci

      - name: 检查 Windows 捆绑的运行时
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          # wintun 随仓库分发，缺失属于致命错误
          test -f src-tauri/resources/openconnect/wintun.dll \
            || { echo "::error::缺少 wintun.dll"; exit 1; }
          test -f src-tauri/resources/openconnect/wintun-license.txt \
            || { echo "::error::缺少 wintun-license.txt（分发义务要求保留）"; exit 1; }
          echo "✅ wintun.dll $(stat -c%s src-tauri/resources/openconnect/wintun.dll) bytes"

          # openconnect.exe 需用户自备，缺失仅警告
          if [ -f "src-tauri/resources/openconnect/openconnect.exe" ]; then
            echo "✅ 已找到内置 openconnect.exe"
            ls -la src-tauri/resources/openconnect/
          else
            echo "::warning::src-tauri/resources/openconnect/openconnect.exe 不存在，本次产物将不含内置 openconnect，用户需自行指定路径。"
          fi

      - name: 校验 macOS 内置运行时
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          OC=src-tauri/resources/openconnect/macos-arm64/openconnect
          if [ ! -x "$OC" ]; then
            echo "::error::缺少内置 openconnect，请在本机执行 scripts/bundle-openconnect-macos.sh 后提交 macos-arm64/ 目录"
            exit 1
          fi
          "$OC" --version

      # 有 tag 时创建草稿 release；手动触发时只构建并上传 artifact
      - name: 构建并打包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 以下变量留空时 Tauri 自动跳过签名与公证，无需删改 workflow。
          # 配置方式见 README「GitHub Actions 自动打包」一节。
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Octauri ${{ github.ref_name }}"
          releaseBody: >-
            macOS 产物为 .dmg（未签名，首次打开需右键 →「打开」，或执行
            xattr -dr com.apple.quarantine /Applications/Octauri.app）；
            Windows 产物为 NSIS 安装包 .exe（未签名，SmartScreen 会提示）。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          if-no-files-found: warn
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe