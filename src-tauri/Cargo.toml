[package]
name = "octauri"
version = "1.0.3"
description = "Octauri - a thin shell client for the openconnect CLI"
authors = ["Octauri Contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[lib]
name = "octauri_lib"
# 桌面端只需要 rlib（staticlib 仅为兼容 Tauri 移动端模板保留）。
# 注意：不要加回 "cdylib" —— Windows-GNU 目标下 rustc 会把全部符号写进
# 导出表（10 万+），超出 PE 65535 个序号的硬限制而链接失败；
# 且本项目没有移动端目标，cdylib 并无用途。
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 仅保留必需依赖：Tauri 运行时、序列化、系统钥匙串、路径选择对话框。
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_Console",
] }

[features]
# 生产构建必须启用这个 feature（tauri CLI 的 build 会自动加）：
# Tauri 用 tauri/custom-protocol 区分 dev / prod，不启用时 tauri 认为仍是
# 开发构建，会去加载 build.devUrl（http://localhost:1420），
# 双击 exe 就会看到 "localhost 拒绝连接"。
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
